[package]
name = "cineminha-desktop"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
base64 = "0.22"
bytes = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
futures-util = "0.3"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
secp256k1 = { version = "0.31", features = ["rand", "hashes", "global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
webrtc = { path = "vendor/webrtc" }
